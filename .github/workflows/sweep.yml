# Wakes the sweeper, continuously.
#
# This lived in the private SAGT-APP repository first, as short runs on a
# five-minute schedule. Two things were wrong with that. GitHub throttles
# schedules to roughly every twenty-five minutes in practice, and each run
# ticked for only five - so the sweeper worked at about a tenth of its duty
# cycle, and a 200-page board took half a day to re-sweep. The boards read
# "15 hours ago" on the live site, which is where this was noticed. And longer
# runs were not an option there: private repositories pay for Actions minutes,
# and a near-continuous sweeper burns the free tier in days. Public
# repositories are unlimited, hence this one.
#
# Each run ticks for most of six hours against a schedule of every 15 minutes.
#
# The 27-minute version of this assumed GitHub fires the schedule 25-30
# minutes apart. Measured across a full morning on 2026-08-24, it fired 30,
# 37, 44, 46, 50, 58 and 71 minutes apart - so a 27-minute run left the
# sweeper unconscious for 191 of 454 minutes, 42% of the window, with a
# 44-minute hole in the middle of it. Boards read "390 minutes ago" on a site
# whose whole promise is that they do not.
#
# A run has to outlast the worst firing gap, not the average one, or the gap
# is simply reintroduced on the bad days. Six hours is the ceiling GitHub
# allows a job, so the run takes the ceiling minus a margin, and the
# concurrency group holds exactly one run pending behind the current one -
# which starts the moment this one ends. That is a continuous duty cycle from
# a schedule that cannot be relied on to fire.
#
# This does not sweep harder, and it must not be mistaken for a way to. The
# request budget is claimed atomically and a tick that finds it spent returns
# at once, so the ceiling on work is unchanged - the run length only decides
# how much of the hour there is anybody awake to spend it.
name: Sweep

on:
  schedule:
    # The backstop, not the mechanism. Each run starts the next one itself
    # (see the hand-off step); this only restarts the chain if a run dies in a
    # way that skips the hand-off, and re-arms it after GitHub disables the
    # schedule on an inactive repository.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # To start the next run itself. See the hand-off step at the bottom: the
    # schedule cannot be relied on to fire, so each run queues its successor
    # rather than hoping GitHub remembers.
    permissions:
      actions: write
    # GitHub's hard ceiling for a job is 360 minutes; this leaves the loop
    # room to finish its last tick and exit cleanly rather than being killed
    # mid-request, which reads as a failed run.
    timeout-minutes: 355
    steps:
      - name: Tick until the next run is due
        env:
          CRON_KEY: ${{ secrets.CRON_SECRET }}
        run: |
          # A single flaky request used to fail the whole run. Measured over
          # fifteen runs: fourteen were clean and one hit tick 7 with curl's
          # own 000 - no response reached the client at all, a transport blip
          # on GitHub's runner or the network between it and Vercel, not
          # anything sagt-api said. The service answered 200 in under two
          # seconds both immediately before and immediately after. Exiting on
          # that one request threw away six good ticks and paged as "all jobs
          # have failed", which is the wrong alarm for the wrong problem: it
          # reports network jitter as a service outage.
          #
          # A tick is now retried once, a few seconds later, before being
          # counted as failed - the same request usually just works the second
          # time. Only a RUN of failures (three in a row, after retries) means
          # the service is actually down rather than the network having a bad
          # moment, and that is the one case still worth failing loudly for.
          # 5h45m. Ten minutes inside timeout-minutes so the loop, not the
          # runner, decides when this run is over.
          END=$(( $(date +%s) + 20700 ))
          i=0
          consecutive_failures=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1))
            code=$(curl -s -o /tmp/tick.json -w '%{http_code}' \
              --max-time 70 \
              -H "x-cron-key: $CRON_KEY" \
              https://sagt-api.vercel.app/api/tick || echo 000)
            if [ "$code" != "200" ]; then
              echo "tick $i -> HTTP $code, retrying once"
              sleep 8
              code=$(curl -s -o /tmp/tick.json -w '%{http_code}' \
                --max-time 70 \
                -H "x-cron-key: $CRON_KEY" \
                https://sagt-api.vercel.app/api/tick || echo 000)
            fi
            echo "tick $i -> HTTP $code"
            if [ "$code" != "200" ]; then
              consecutive_failures=$((consecutive_failures+1))
              echo "::warning::sweep tick $i failed twice in a row (HTTP $code) - $consecutive_failures consecutive"
              if [ "$consecutive_failures" -ge 3 ]; then
                echo "::error::three ticks in a row have failed after retry - the service may actually be down"
                exit 1
              fi
              if [ "$(date +%s)" -lt "$END" ]; then sleep 25; fi
              continue
            fi
            consecutive_failures=0
            if [ -s /tmp/tick.json ]; then
              python3 -c "import json;d=json.load(open('/tmp/tick.json'));print('   ',d.get('did'),'| pages',d.get('pages'),'|',' / '.join(d.get('log',[])))" 2>/dev/null || true
            fi
            # A tick with work takes ~35-95s on its own; this spaces them so
            # each lands in a fresh slice of the request budget rather than
            # hammering an empty ledger.
            if [ "$(date +%s)" -lt "$END" ]; then sleep 25; fi
          done
          echo "ran $i ticks"

      # Start the next run before this one ends.
      #
      # Every gap this workflow has ever left came from waiting for GitHub to
      # fire the schedule. Measured on 2026-08-27/28: a */15 schedule firing 30,
      # 37, 44, 46, 50, 58 and 71 minutes apart, then 2 to 4.6 hour gaps once
      # the runs got long - 34% of the day with nothing sweeping. The cost is
      # not only lost pages: the upstream session lasts an hour and is renewed
      # inside a tick, so a long enough gap kills the credential and it stays
      # dead until somebody notices.
      #
      # A run that is already going does not have to wait to be scheduled. It
      # queues its own successor, the concurrency group holds it until this one
      # finishes, and it starts within seconds of that. The chain is the
      # mechanism; the cron above is only what restarts it if a link breaks.
      #
      # always(), so a run that failed still hands over. A broken tick is a
      # reason to try again, not a reason to stop trying forever - and without
      # this, one bad run would leave the sweeper dark until the schedule
      # happened to fire.
      - name: Hand off to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sweep.yml --repo "$GITHUB_REPOSITORY"
